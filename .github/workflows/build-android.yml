name: Build APK Família Servita

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-source.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar fontes Android
        run: unzip -q android-source.zip

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restaurar keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Configure o secret ANDROID_KEYSTORE_BASE64."; exit 1; }
          test -n "$KS_PASS" || { echo "Configure o secret KS_PASS."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/servita.jks

      - name: Compilar APK release assinado
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle --no-daemon assembleRelease

      - name: Preparar nome público
        run: cp android/app/build/outputs/apk/release/app-release.apk Familia-Servita-2.8.9.apk

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Familia-Servita-2.8.9-release
          path: Familia-Servita-2.8.9.apk

      - name: Publicar versão Android
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v2.8.9
          name: Família Servita 2.8.9 para Android
          body: |
            APK release assinado do Hoje na Família Servita.

            - ícone adaptativo OSM;
            - backup de dados desativado;
            - assinatura release persistente.
          files: Familia-Servita-2.8.9.apk
