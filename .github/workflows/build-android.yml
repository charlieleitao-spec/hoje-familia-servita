name: Build APK Família Servita

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-source.zip"
      - "android-release.patch"
      - "familia-servita-android-icons.zip"
      - "index.html"
      - "android-pdf/**"
      - "scripts/preparar-pdfs-android.py"
      - "tests/pdf-link/**"
      - "MainActivity-revisado.java"
      - "somos-servos.html"
      - "integracao-somos-servos/**"
      - "scripts/preparar-blog-android.py"
      - "causas-beatos.html"
      - "missas-proprias.html"
      - "servita.json"
      - "santoral.json"
      - "scripts/check-web.cjs"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon-192.png"
      - "icon-512.png"
      - "favicon-32.png"
      - "favicon-64.png"
      - ".github/workflows/build-android.yml"
  push:
    branches: [main, feat/somos-servos-gas-offline-20261022, feat/pdf-reader-offline]
    paths:
      - "android-pdf/**"
      - "scripts/preparar-pdfs-android.py"
      - "tests/pdf-link/**"
      - "MainActivity-revisado.java"
      - "somos-servos.html"
      - "integracao-somos-servos/**"
      - "scripts/preparar-blog-android.py"
      - "android-source.zip"
      - "android-release.patch"
      - "familia-servita-android-icons.zip"
      - "index.html"
      - "causas-beatos.html"
      - "missas-proprias.html"
      - "servita.json"
      - "santoral.json"
      - "scripts/check-web.cjs"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon-192.png"
      - "icon-512.png"
      - "favicon-32.png"
      - "favicon-64.png"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Validar arquivos web
        run: node scripts/check-web.cjs

      - name: Preparar fontes Android
        run: unzip -q android-source.zip

      - name: Aplicar ajustes de release
        run: git apply --check android-release.patch && git apply android-release.patch

      - name: Incorporar MainActivity revisada
        run: cp MainActivity-revisado.java android/app/src/main/java/br/org/servitas/familia/MainActivity.java

      - name: Incorporar leitor e PDFs locais
        run: python3 scripts/preparar-pdfs-android.py

      - name: Incorporar leitor local do Somos Servos
        env:
          SOMOS_SERVOS_GAS_URL: ${{ vars.SOMOS_SERVOS_GAS_URL }}
          BUILD_EVENT: ${{ github.event_name }}
        run: |
          if [ "$BUILD_EVENT" = "pull_request" ]; then
            python3 scripts/preparar-blog-android.py --allow-unconfigured
          else
            python3 scripts/preparar-blog-android.py
          fi

      - name: Aplicar ícones Servitas
        run: |
          find android/app/src/main/res -type f -name 'ic_launcher*' -delete
          unzip -oq familia-servita-android-icons.zip -d icon-pacote
          cp -R icon-pacote/res/. android/app/src/main/res/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = re.sub(r'android:allowBackup="[^"]+"', 'android:allowBackup="false"', s)
          if 'android:allowBackup=' not in s:
              s = s.replace('<application', '<application android:allowBackup="false"', 1)
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              raise SystemExit('Manifesto sem android:icon @mipmap/ic_launcher')
          if re.search(r'android:roundIcon="[^"]+"', s):
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', s)
          else:
              s = s.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', 1)
          p.write_text(s)
          PY

      - name: Atualizar versão do APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          m = re.search(r'versionCode\s+(\d+)', s)
          if not m:
              raise SystemExit('versionCode não encontrado')
          code = 313  # 2.9.32 sucede 2.9.31 (312)
          s = re.sub(r'versionCode\s+\d+', f'versionCode {code}', s, count=1)
          if not re.search(r'versionName\s+"[^"]+"', s):
              raise SystemExit('versionName não encontrado')
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "2.9.32"', s, count=1)
          p.write_text(s)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('APP_VERSION=2.9.32\nAPP_VERSION_CODE=' + str(code) + '\n')
          print('APK versionName=2.9.32 versionCode=' + str(code))
          PY
      - name: Validar fontes Android de release
        run: |
          grep -q 'signingConfigs' android/app/build.gradle || { echo "Falta signingConfig.release."; exit 1; }
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml || { echo "Falta allowBackup=false."; exit 1; }
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || { echo "Falta o ícone adaptativo."; exit 1; }
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || { echo "Falta o ícone redondo adaptativo."; exit 1; }
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_monochrome.png || { echo "Falta o ícone monocromático."; exit 1; }
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml || { echo "Manifesto sem roundIcon correto."; exit 1; }

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Testar resolução dos PDFs
        run: |
          mkdir -p /tmp/pdf-link-test
          javac -d /tmp/pdf-link-test android-pdf/PdfLink.java tests/pdf-link/PdfLinkTest.java
          java -cp /tmp/pdf-link-test br.org.servitas.familia.PdfLinkTest

      - name: Compilar Android de teste sem credenciais de assinatura
        if: github.event_name == 'pull_request'
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Restaurar keystore de release
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Configure o secret ANDROID_KEYSTORE_BASE64."; exit 1; }
          test -n "$KS_PASS" || { echo "Configure o secret KS_PASS."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/servita.jks

      - name: Compilar APK release assinado
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle --no-daemon assembleRelease assembleReleaseAndroidTest

      - name: Preparar nome público
        if: github.event_name != 'pull_request'
        run: cp android/app/build/outputs/apk/release/app-release.apk "Familia-Servita-${APP_VERSION}.apk"

      - name: Verificar assinatura e compatibilidade do APK
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          AAPT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/aapt"
          APK="Familia-Servita-${APP_VERSION}.apk"
          PREVIOUS=Familia-Servita-anterior.apk
          PREVIOUS_URL=$(curl -fsSL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" | jq -r '[.assets[] | select(.name | endswith(".apk"))][0].browser_download_url // empty')
          test -n "$PREVIOUS_URL" || { echo "Não foi possível localizar o APK da última release."; exit 1; }
          echo "Comparando com: $PREVIOUS_URL"
          curl -fsSL "$PREVIOUS_URL" -o "$PREVIOUS"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > atual.txt
          "$APKSIGNER" verify --verbose --print-certs "$PREVIOUS" > anterior.txt
          cat atual.txt
          ATUAL_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' atual.txt | head -1)
          ANTERIOR_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' anterior.txt | head -1)
          test -n "$ATUAL_CERT" && test "$ATUAL_CERT" = "$ANTERIOR_CERT"
          ATUAL_BADGING=$("$AAPT" dump badging "$APK" | head -1)
          ANTERIOR_BADGING=$("$AAPT" dump badging "$PREVIOUS" | head -1)
          ATUAL_CODE=$(echo "$ATUAL_BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")
          ANTERIOR_CODE=$(echo "$ANTERIOR_BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")
          echo "$ATUAL_BADGING"
          echo "Baseline: $ANTERIOR_BADGING"
          test "$ATUAL_CODE" = "$APP_VERSION_CODE"
          test "$ATUAL_CODE" -gt "$ANTERIOR_CODE"
          "$AAPT" dump resources "$APK" > apk-resources.txt
          for resource in ic_launcher ic_launcher_round ic_launcher_monochrome; do grep -q "mipmap/$resource" apk-resources.txt; done
          grep -E "mipmap/ic_launcher(_round|_monochrome)?" apk-resources.txt | head -12
          echo "Assinatura SHA-256 igual à versão distribuída: $ATUAL_CERT"
      - name: Habilitar KVM para validar o leitor Android
        if: github.event_name != 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validar PDFs e impressão Android sem conexão
        if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install Familia-Servita-2.9.32.apk
            adb install -t android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w br.org.servitas.familia.test/br.org.servitas.familia.validation.PdfInstrumentation | tee pdf-android-validation.txt
            grep -q 'validation=PASS' pdf-android-validation.txt

      - name: Guardar evidências dos PDFs
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: validacao-pdfs-2.9.32
          path: pdf-android-validation.txt
          if-no-files-found: warn

      - name: Guardar artefato
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Familia-Servita-${{ env.APP_VERSION }}-release
          path: Familia-Servita-${{ env.APP_VERSION }}.apk

      - name: Publicar versão Android
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.APP_VERSION }}
          name: Família Servita ${{ env.APP_VERSION }} para Android
          body: |
            APK release assinado do Hoje na Família Servita.

            - leitor interno dos PDFs, com ampliação e impressão do documento original;
            - leitor local de postagens do Somos Servos integrado ao WebView;
            - atualização pelo Apps Script com Blogger API v3;
            - cache local para conservar a última consulta válida sem internet;
            - links para os materiais litúrgicos da Família Servita.
          files: Familia-Servita-${{ env.APP_VERSION }}.apk


