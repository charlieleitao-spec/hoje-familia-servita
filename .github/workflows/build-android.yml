name: Build APK Família Servita

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-source.zip"
      - "android-release.patch"
      - "familia-servita-android-icons.zip"
      - "index.html"
      - "biblioteca-servita.html"
      - "data/biblioteca-servita-catalogo.json"
      - "scripts/sync-biblioteca.py"
      - "android-pdf/**"
      - "scripts/verify-android-update.py"
      - "scripts/preparar-pdfs-android.py"
      - "tests/pdf-link/**"
      - "MainActivity-revisado.java"
      - "somos-servos.html"
      - "integracao-somos-servos/**"
      - "scripts/preparar-blog-android.py"
      - "causas-beatos.html"
      - "missas-proprias.html"
      - "servita.json"
      - "santoral.json"
      - "scripts/check-web.cjs"
      - "tests/uso-diario-dom.cjs"
      - "tests/missa-api-dom.cjs"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon-192.png"
      - "icon-512.png"
      - "favicon-32.png"
      - "favicon-64.png"
      - ".github/workflows/build-android.yml"
  push:
    branches: [main, feat/somos-servos-gas-offline-20261022, feat/pdf-reader-offline]
    paths:
      - "biblioteca-servita.html"
      - "data/biblioteca-servita-catalogo.json"
      - "scripts/sync-biblioteca.py"
      - "android-pdf/**"
      - "scripts/verify-android-update.py"
      - "scripts/preparar-pdfs-android.py"
      - "tests/pdf-link/**"
      - "MainActivity-revisado.java"
      - "somos-servos.html"
      - "integracao-somos-servos/**"
      - "scripts/preparar-blog-android.py"
      - "android-source.zip"
      - "android-release.patch"
      - "familia-servita-android-icons.zip"
      - "index.html"
      - "causas-beatos.html"
      - "missas-proprias.html"
      - "servita.json"
      - "santoral.json"
      - "scripts/check-web.cjs"
      - "tests/uso-diario-dom.cjs"
      - "tests/missa-api-dom.cjs"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon-192.png"
      - "icon-512.png"
      - "favicon-32.png"
      - "favicon-64.png"
      - ".github/workflows/build-android.yml"

env:
  APP_VERSION: "2.9.37"
  APP_VERSION_CODE: "318"

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      android_required: ${{ steps.scope.outputs.android_required }}
      release_exists: ${{ steps.published_release.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar aplicação web e integrações
        run: |
          node scripts/check-web.cjs
          node --test tests/*.test.* integracao-somos-servos/tests/integration.test.cjs
          npm install --prefix "$RUNNER_TEMP/familia-dom" --no-package-lock --no-audit --no-fund jsdom@26.1.0
          export NODE_PATH="$RUNNER_TEMP/familia-dom/node_modules"
          node tests/uso-diario-dom.cjs
          node tests/missa-api-dom.cjs
      - name: Identificar necessidade de APK
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          event = os.environ['GITHUB_EVENT_NAME']
          before = os.environ.get('BEFORE_SHA', '')
          web_only = {'index.html', 'sw.js', 'tests/uso-diario-dom.cjs',
                      'tests/missa-api-dom.cjs'}
          required = True
          if event == 'push' and before and set(before) != {'0'}:
              paths = subprocess.check_output(
                  ['git', 'diff', '--name-only', before, os.environ['GITHUB_SHA']],
                  text=True).splitlines()
              required = not paths or any(path not in web_only for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('android_required=' + str(required).lower() + '\n')
          print('APK necessário.' if required else
                'Alteração somente web: APK publicado preservado. Validação web concluída.')
          PY

      - name: Preservar versões Android já publicadas
        id: published_release
        if: steps.scope.outputs.android_required == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/android-v${APP_VERSION}")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Versão já publicada: preservar o APK existente." ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Não foi possível verificar a versão publicada (HTTP $status)."; exit 1 ;;
          esac

  build:
    needs: web
    if: needs.web.outputs.android_required == 'true' && needs.web.outputs.release_exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Incorporar PDFs da Biblioteca Servita
        run: python3 scripts/sync-biblioteca.py

      - name: Validar arquivos web
        run: node scripts/check-web.cjs

      - name: Preparar fontes Android
        run: unzip -q android-source.zip

      - name: Aplicar ajustes de release
        run: git apply --check android-release.patch && git apply android-release.patch

      - name: Incorporar MainActivity revisada
        run: cp MainActivity-revisado.java android/app/src/main/java/br/org/servitas/familia/MainActivity.java

      - name: Incorporar leitor e PDFs locais
        run: python3 scripts/preparar-pdfs-android.py

      - name: Incorporar leitor local do Somos Servos
        env:
          SOMOS_SERVOS_GAS_URL: ${{ vars.SOMOS_SERVOS_GAS_URL }}
          BUILD_EVENT: ${{ github.event_name }}
        run: |
          if [ "$BUILD_EVENT" = "pull_request" ]; then
            python3 scripts/preparar-blog-android.py --allow-unconfigured
          else
            python3 scripts/preparar-blog-android.py
          fi

      - name: Aplicar ícones Servitas
        run: |
          find android/app/src/main/res -type f -name 'ic_launcher*' -delete
          unzip -oq familia-servita-android-icons.zip -d icon-pacote
          cp -R icon-pacote/res/. android/app/src/main/res/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = re.sub(r'android:allowBackup="[^"]+"', 'android:allowBackup="false"', s)
          if 'android:allowBackup=' not in s:
              s = s.replace('<application', '<application android:allowBackup="false"', 1)
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              raise SystemExit('Manifesto sem android:icon @mipmap/ic_launcher')
          if re.search(r'android:roundIcon="[^"]+"', s):
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', s)
          else:
              s = s.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', 1)
          p.write_text(s)
          PY

      - name: Atualizar versão do APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          m = re.search(r'versionCode\s+(\d+)', s)
          if not m:
              raise SystemExit('versionCode não encontrado')
          code = int(os.environ['APP_VERSION_CODE'])
          version = os.environ['APP_VERSION']
          s = re.sub(r'versionCode\s+\d+', f'versionCode {code}', s, count=1)
          if not re.search(r'versionName\s+"[^"]+"', s):
              raise SystemExit('versionName não encontrado')
          s = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version}"', s, count=1)
          p.write_text(s)
          print(f'APK versionName={version} versionCode={code}')
          PY
      - name: Validar fontes Android de release
        run: |
          grep -q 'signingConfigs' android/app/build.gradle || { echo "Falta signingConfig.release."; exit 1; }
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml || { echo "Falta allowBackup=false."; exit 1; }
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || { echo "Falta o ícone adaptativo."; exit 1; }
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || { echo "Falta o ícone redondo adaptativo."; exit 1; }
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_monochrome.png || { echo "Falta o ícone monocromático."; exit 1; }
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml || { echo "Manifesto sem roundIcon correto."; exit 1; }

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Testar resolução dos PDFs
        run: |
          mkdir -p /tmp/pdf-link-test
          javac -d /tmp/pdf-link-test android-pdf/PdfLink.java tests/pdf-link/PdfLinkTest.java
          java -cp /tmp/pdf-link-test br.org.servitas.familia.PdfLinkTest

      - name: Compilar Android de teste sem credenciais de assinatura
        if: github.event_name == 'pull_request'
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Restaurar keystore de release
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Configure o secret ANDROID_KEYSTORE_BASE64."; exit 1; }
          test -n "$KS_PASS" || { echo "Configure o secret KS_PASS."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/servita.jks

      - name: Compilar APK release assinado
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle --no-daemon assembleRelease assembleReleaseAndroidTest

      - name: Preparar nome público
        if: github.event_name != 'pull_request'
        run: cp android/app/build/outputs/apk/release/app-release.apk "Familia-Servita-${APP_VERSION}.apk"

      - name: Verificar assinatura e compatibilidade do APK
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          AAPT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/aapt"
          APK="Familia-Servita-${APP_VERSION}.apk"
          PREVIOUS=Familia-Servita-anterior.apk
          PREVIOUS_URL=$(curl -fsSL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" | jq -r '[.assets[] | select(.name | endswith(".apk"))][0].browser_download_url // empty')
          test -n "$PREVIOUS_URL" || { echo "Não foi possível localizar o APK da última release."; exit 1; }
          echo "Comparando com: $PREVIOUS_URL"
          curl -fsSL "$PREVIOUS_URL" -o "$PREVIOUS"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > atual.txt
          "$APKSIGNER" verify --verbose --print-certs "$PREVIOUS" > anterior.txt
          cat atual.txt
          ATUAL_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' atual.txt | head -1)
          ANTERIOR_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' anterior.txt | head -1)
          test -n "$ATUAL_CERT" && test "$ATUAL_CERT" = "$ANTERIOR_CERT"
          ATUAL_BADGING=$("$AAPT" dump badging "$APK" | head -1)
          ANTERIOR_BADGING=$("$AAPT" dump badging "$PREVIOUS" | head -1)
          ATUAL_CODE=$(echo "$ATUAL_BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")
          ANTERIOR_CODE=$(echo "$ANTERIOR_BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")
          echo "$ATUAL_BADGING"
          echo "Baseline: $ANTERIOR_BADGING"
          test "$ATUAL_CODE" = "$APP_VERSION_CODE"
          test "$ATUAL_CODE" -gt "$ANTERIOR_CODE"
          "$AAPT" dump resources "$APK" > apk-resources.txt
          for resource in ic_launcher ic_launcher_round ic_launcher_monochrome; do grep -q "mipmap/$resource" apk-resources.txt; done
          grep -E "mipmap/ic_launcher(_round|_monochrome)?" apk-resources.txt | head -12
          echo "Assinatura SHA-256 igual à versão distribuída: $ATUAL_CERT"
      - name: Habilitar KVM para validar o leitor Android
        if: github.event_name != 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validar PDFs e impressão Android sem conexão
        if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb install Familia-Servita-anterior.apk
            adb shell dumpsys package br.org.servitas.familia > package-before-update.txt
            adb install -r "Familia-Servita-${APP_VERSION}.apk"
            adb shell dumpsys package br.org.servitas.familia > package-after-update.txt
            python3 scripts/verify-android-update.py package-before-update.txt package-after-update.txt
            adb install -t android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell sleep 3
            adb shell dumpsys connectivity > connectivity-offline.txt
            grep -Eq 'Active default network: (none|null|\(none\)|-1)' connectivity-offline.txt
            adb shell am instrument -w br.org.servitas.familia.test/br.org.servitas.familia.validation.PdfInstrumentation | tee pdf-android-validation.txt
            grep -Fxq 'PASS: 79 PDFs; 618 pages; original print bytes; zoom; Android printing; cancel and return.' pdf-android-validation.txt
            grep -Fxq 'PASS: PDF rotation retains page 44 and zoom 125% in landscape and portrait.' pdf-android-validation.txt
            grep -Fxq 'PASS: Fresh offline fallback opens Library links at pages 43, 25 and 131.' pdf-android-validation.txt

      - name: Guardar evidências dos PDFs
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: validacao-pdfs-${{ env.APP_VERSION }}
          path: |
            pdf-android-validation.txt
            package-before-update.txt
            package-after-update.txt
            connectivity-offline.txt
            pdf-logcat.txt
            pdf-window.xml
          if-no-files-found: warn

      - name: Guardar artefato
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Familia-Servita-${{ env.APP_VERSION }}-release
          path: Familia-Servita-${{ env.APP_VERSION }}.apk

      - name: Preservar PDFs verificados para consulta web
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pdfs/biblioteca/
          if ! git diff --cached --quiet; then
            git commit -m "Inclui PDFs verificados da Biblioteca Servita"
            git push origin HEAD:main
          fi

      - name: Publicar versão Android
        if: github.ref == 'refs/heads/main' && needs.web.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.APP_VERSION }}
          name: Família Servita ${{ env.APP_VERSION }} para Android
          body_path: docs/releases/${{ env.APP_VERSION }}.md
          files: Familia-Servita-${{ env.APP_VERSION }}.apk


