name: Validar base derivada OSM

on:
  workflow_dispatch:
  push:
    paths:
      - "servita.json"
      - ".github/workflows/sync-common-data.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar JSON derivado
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('servita.json','utf8'));
          const keys=Object.keys(x);
          if(!x || typeof x!=='object' || Array.isArray(x) || keys.length<30) {
            throw new Error('Base servita incompleta');
          }
          if(x['12-14']) throw new Error('Data antiga de Boaventura (14/12) reintroduzida');
          if(!x['12-15']) throw new Error('Boaventura (15/12) ausente');
          console.log('Base derivada válida:',keys.length,'celebrações');
          NODE
