name: Testar atualização Android 2.9.15

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-android-update.yml'
      - 'scripts/test-android-update.sh'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Baixar os APKs publicados e conferir integridade
        run: |
          mkdir -p android-test
          curl --fail --location --retry 3 'https://github.com/charlieleitao-spec/hoje-familia-servita/releases/download/android-v2.9.13/Familia-Servita-2.9.13.apk' -o android-test/previous.apk
          curl --fail --location --retry 3 'https://github.com/charlieleitao-spec/hoje-familia-servita/releases/download/android-v2.9.15/Familia-Servita-2.9.15.apk' -o android-test/current.apk
          echo 'abe63756a2bf6f3defcafbe6363dcbb0a61afe510ee0891985d9b0ab0ebb8d25  android-test/previous.apk' | sha256sum --check
          echo 'c8ebaebfe65472e98cbb079ee6702a5efc52e57985a5cbe6bf811761ba455d5c  android-test/current.apk' | sha256sum --check
      - name: Instalar, atualizar e testar o aplicativo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          script: bash scripts/test-android-update.sh
      - name: Guardar evidências do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-atualizacao-2.9.15
          path: |
            android-test/*.txt
            android-test/*.xml
