name: Verificar rotação do PDF em Android
on:
  pull_request:
    paths:
      - 'android-pdf/**'
      - '.github/workflows/test-pdf-rotation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar aplicativo de teste
        run: |
          python3 scripts/sync-biblioteca.py
          unzip -q android-source.zip
          cp MainActivity-revisado.java android/app/src/main/java/br/org/servitas/familia/MainActivity.java
          python3 scripts/preparar-pdfs-android.py
          python3 scripts/preparar-blog-android.py --allow-unconfigured
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          text=p.read_text()
          assert "testBuildType 'release'" in text
          p.write_text(text.replace("testBuildType 'release'", "testBuildType 'debug'"))
          PY
      - name: Compilar APK e instrumentação debug
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Executar leitor offline e rotação
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install -t android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w br.org.servitas.familia.test/br.org.servitas.familia.validation.PdfInstrumentation > pdf-rotation.txt
            cat pdf-rotation.txt
            grep -Fxq 'PASS: PDF rotation retains page 44 and zoom 125% in landscape and portrait.' pdf-rotation.txt
      - name: Guardar evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-rotation-api35
          path: pdf-rotation.txt
          if-no-files-found: warn
