<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca Servita</title>
<style>:root{color-scheme:light}*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;background:#f7f4ed;color:#292b2f;margin:0}main{max-width:760px;margin:auto;padding:20px 16px 64px}h1,h2{font-family:Georgia,serif;color:#173b67}h1{font-size:1.8rem;margin-bottom:0}.intro{margin-top:0;color:#555}.doc{background:white;border:1px solid #ddd4c4;border-radius:12px;margin:12px 0;padding:16px}.doc h2{font-size:1.13rem;margin:0 0 6px}.meta{color:#5e5e5e;font-size:.88rem;margin:0 0 10px}a{color:#173b67;display:inline-block;min-height:44px;padding:9px 12px;border:1px solid #173b67;border-radius:8px;text-decoration:none;font-weight:600}a:focus-visible{outline:3px solid #b89448}.note{font-size:.9rem;color:#555}</style></head>
<body><main><h1>Biblioteca Servita</h1><p class="intro">Documentos fundamentais da Ordem dos Servos de Maria.</p><div id="documents"><p>Carregando catálogo…</p></div><p class="note">A consulta offline depende da inclusão dos PDFs verificados no aplicativo. Enquanto isso, os links externos podem exigir internet.</p></main>
<script>
(async()=>{const root=document.getElementById('documents');try{const res=await fetch('./data/biblioteca-servita-catalogo.json');if(!res.ok)throw Error('catálogo indisponível');const data=await res.json();root.replaceChildren();for(const doc of data.documents){const article=document.createElement('article');article.className='doc';const h=document.createElement('h2');h.textContent=doc.title;article.append(h);if(doc.edition){const p=document.createElement('p');p.className='meta';p.textContent=doc.edition;article.append(p)}if(doc.offline_asset){const a=document.createElement('a');a.href=doc.offline_asset;a.textContent='Abrir PDF';article.append(a)}else if(doc.source_url){const a=document.createElement('a');a.href=doc.source_url;a.textContent='Consultar fonte';a.target='_blank';a.rel='noopener noreferrer';article.append(a)}else{const p=document.createElement('p');p.className='meta';p.textContent='PDF em preparação';article.append(p)}root.append(article)}}catch(e){root.textContent='Não foi possível carregar o catálogo nesta instalação.'}})();
</script></body></html>
